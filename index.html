<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dracula: Conquest!</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦇</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
</head>
<body>
    <div id="start-menu" class="start-overlay">
        <div class="start-content">
            <h1 class="gothic-title">
                <span class="gothic-main">DRACULA</span><br>
                <span class="gothic-sub">CONQUEST</span>
            </h1>
            <p class="start-desc">Тьма пробуждается. Европа склонится перед ночью.</p>
            <div class="start-buttons">
                <button id="btn-new-game" class="action-btn main-action">НОВАЯ ИГРА</button>
                <button id="btn-load-game" class="action-btn">ЗАГРУЗИТЬ</button>
            </div>
        </div>
    </div>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="main-area">
                <div id="bg-layer"></div>
                
                <div id="top-bar">
                    <div class="stat">ХОД: <span id="turn-counter">1</span></div>
                    <div class="stat">ДЕНЬ: <span id="day-counter">1</span></div>
                    <div class="stat">Действия: <span id="ap-counter">2/2</span></div>
                    <div class="stat">Кровь: <span id="blood-counter">10</span></div>
                    <div class="stat">Золото: <span id="gold-counter">100</span></div>
                </div>

                <div id="menu-bar">
                    <button id="btn-mnu-new-game" class="menu-btn main-action">НОВАЯ ИГРА</button>
                    <button id="btn-mnu-save" class="menu-btn">СОХРАНИТЬ</button>
                    <button id="btn-mnu-load" class="menu-btn">ЗАГРУЗИТЬ</button>
                    <button id="btn-mnu-restart" class="menu-btn">МЕНЮ</button>
                    <button id="btn-music-toggle" class="menu-btn">🔊</button>
                </div>
                
                <div id="pixi-container" style="position: relative; z-index: 1; margin-top: 55px; width: 690px; height: 490px; border: 1px solid transparent;"></div>
                
                <div id="ui-panel">
                    <div id="action-buttons">
                        <button id="btn-assault" class="action-btn" disabled>ШТУРМ</button>
                        
                        <div class="dropdown">
                            <button class="action-btn dropdown-toggle">СТРОИТЬ</button>
                            <div class="dropdown-content">
                                <button id="build-cemetery" class="sub-btn">Кладбище (30🪙)</button>
                                <button id="build-barracks" class="sub-btn">Казармы Lv1 (20🪙)</button>
                                <button id="build-ritual" class="sub-btn">Храм Тьмы (20🪙)</button>
                                <button id="build-wall" class="sub-btn">Стены (10🪙)</button>
                                <button id="build-castle" class="sub-btn">Замок (40🪙)</button>
                                <button id="build-citadel" class="sub-btn">Цитадель (40🪙)</button>
                            </div>
                        </div>

                        <div class="dropdown">
                            <button class="action-btn dropdown-toggle">ПРИЗВАТЬ</button>
                            <div class="dropdown-content">
                                <button id="recruit-inf" class="sub-btn">Пехота (10🪙)</button>
                                <button id="recruit-arch" class="sub-btn">Лучники (15🪙)</button>
                                <button id="recruit-cav" class="sub-btn">Кавалерия (20🪙)</button>
                                <button id="recruit-lord" class="sub-btn">Лорд (10🪙)</button>
                            </div>
                        </div>

                        <button id="btn-cancel-siege" class="action-btn">СНЯТЬ ОСАДУ</button>
                        <button id="btn-end-turn" class="action-btn main-action">СЛЕД. ХОД</button>
                    </div>
                </div>
            </div>

            <div id="block-gap"></div>

            <div id="log-sidebar">
                <h3>ХРОНИКИ ТЬМЫ</h3>
                <div id="log-container"></div>
                <button id="btn-clear-log" class="action-btn" style="margin-top:5px; font-size:11px; padding:4px 12px;">ОЧИСТИТЬ</button>
            </div>
        </div>
    </div>

    <div id="tooltip"></div>

    <div id="action-modal" class="modal">
        <div class="modal-content">
            <h2>ВАРВАРЫ У ВОРОТ!</h2>
            <p id="action-desc">Ваша армия вошла в провинцию. Что делать?</p>
            <div id="action-options">
                <button id="btn-siege" class="action-btn" style="border-color: #4a5b9a;">ОСАДИТЬ (1 AP)</button>
                <button id="btn-assault-now" class="action-btn main-action">АТАКОВАТЬ (1 AP)</button>
            </div>
        </div>
    </div>
    <div id="surrender-modal" class="modal">
        <div class="modal-content">
            <h2>ПРОВИНЦИЯ ЗАХВАЧЕНА!</h2>
            <p>Население побеждено. Какова ваша воля?</p>
            <div id="surrender-options">
                <button id="btn-exterminate" class="action-btn main-action" style="background:#2a2040;">ИСТРЕБИТЬ</button>
                <button id="btn-enslave" class="action-btn" style="background:#1a1828; border-color:#4a5b9a;">ПОРАБОТИТЬ</button>
                <button id="btn-convert" class="action-btn" style="background:#0f0d18; border-color:#4a5b9a;">ОБРАТИТЬ</button>
            </div>
            <p id="surrender-result" style="margin-top:10px; font-size:14px; color:#b8c0d0;"></p>
        </div>
    </div>
    <div id="gameover-modal" class="modal">
        <div class="modal-content">
            <h2 id="gameover-title">ИГРА ЗАВЕРШЕНА!</h2>
            <p id="gameover-desc" style="margin: 15px 0; font-size: 16px;"></p>
            <div id="gameover-options">
                <button id="btn-gameover-restart" class="btn-restart-game main-action" style="width: 80%;">НАЧАТЬ ЗАНОВО</button>
            </div>
        </div>
    </div>

    <audio id="bgm" src="./assets/bgm.mp3" loop></audio>
    <script src="script.js"></script>
</body>
</html>
